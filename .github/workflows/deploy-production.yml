name: Deploy — Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '1-Análisis/**'

jobs:
  deploy-production:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        # version read automatically from packageManager field in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # SONARQUBE: --ignore-scripts should not be used here because we need to run the postinstall scripts to build native dependencies like esbuild, there are white-listed in the root package.json using onlyBuiltDependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Test Firestore rules
        run: pnpm --filter @puintegra/api run test:firestore-rules

      - name: Build API
        run: pnpm --filter @puintegra/api build

      - name: Build (production mode)
        working-directory: packages/web
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build --mode production
        env:
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Prepare Firebase Functions runtime bundle
        run: node packages/api/scripts/prepare-firebase-runtime.mjs

      - name: Install Firebase Functions runtime bundle dependencies
        working-directory: packages/api/.firebase-runtime
        run: npm install --omit=dev --no-package-lock

      - name: Prepare Firebase deploy config (production)
        run: |
          node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('firebase.json','utf8')); config.functions={...config.functions, source:'packages/api/.firebase-runtime'}; fs.writeFileSync('firebase.deploy.json', JSON.stringify(config, null, 2) + '\n');"

      - name: Resolve Firebase project (production)
        run: |
          FIREBASE_PROJECT_ID="$(sed -n 's/^VITE_FIREBASE_PROJECT_ID=//p' .env.production | tail -n 1)"
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "VITE_FIREBASE_PROJECT_ID is missing in .env.production" >&2
            exit 1
          fi
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Authenticate Firebase
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Sync shared-secret master key to Secret Manager (production)
        run: |
          gcloud secrets describe PUINTEGRA_SHARED_SECRET_MASTER_KEY --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1 || \
            gcloud secrets create PUINTEGRA_SHARED_SECRET_MASTER_KEY --project "$FIREBASE_PROJECT_ID" --replication-policy=automatic
          printf '%s' "$PUINTEGRA_SHARED_SECRET_MASTER_KEY" | \
            gcloud secrets versions add PUINTEGRA_SHARED_SECRET_MASTER_KEY --project "$FIREBASE_PROJECT_ID" --data-file=-
        env:
          PUINTEGRA_SHARED_SECRET_MASTER_KEY: ${{ secrets.PUINTEGRA_SHARED_SECRET_MASTER_KEY_PRODUCTION }}

      - name: Deploy to Firebase (production)
        run: pnpm exec firebase deploy --config firebase.deploy.json --project "$FIREBASE_PROJECT_ID" --only hosting,functions,firestore,storage --non-interactive

      - name: Bootstrap system administrator permission (production)
        run: pnpm --filter @puintegra/api run bootstrap:system-admin
        env:
          PUINTEGRA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${{ vars.PUINTEGRA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL }}
